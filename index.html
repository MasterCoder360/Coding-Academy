<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coding Academy</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

header{
padding:15px;
background:linear-gradient(90deg,#6366f1,#a855f7);
}

#xp{
position:absolute;
right:20px;
top:20px;
font-weight:bold;
}

canvas{
display:block;
margin:auto;
border-radius:15px;
background:#87ceeb;
}

#editor{
display:none;
margin-top:10px;
}

button{
padding:10px 20px;
margin:10px;
border:none;
border-radius:8px;
background:#6366f1;
color:white;
cursor:pointer;
font-weight:bold;
}

#lessonContainer{
display:flex;
height:420px;
}

#lesson{
width:30%;
background:#1e293b;
padding:15px;
text-align:left;
overflow:auto;
}

#code{
width:35%;
height:100%;
background:#111827;
color:#22c55e;
font-family:monospace;
padding:10px;
border:none;
}

#preview{
width:35%;
height:100%;
background:white;
}

#aiQuestion{
width:100%;
height:60px;
margin-top:10px;
}

#aiResponse{
margin-top:10px;
font-size:14px;
background:#0f172a;
padding:10px;
border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>🚀 Coding Academy</h1>
<p>Click an island to start learning</p>
<div id="xp">⭐ XP: 0</div>
</header>

<canvas id="map"></canvas>

<div id="editor">

<button onclick="runCode()">Run Code</button>
<button onclick="completeLesson()">Complete</button>
<button onclick="closeEditor()">Back</button>

<div id="lessonContainer">

<div id="lesson">

<h2 id="lessonTitle"></h2>

<h3>Lesson</h3>
<p id="lessonText"></p>

<h3>Mission</h3>
<p id="lessonGoal"></p>

<h3>Hint</h3>
<p id="lessonHint"></p>

<h3>🤖 AI Tutor</h3>

<textarea id="aiQuestion" placeholder="Ask the AI tutor..."></textarea>
<button onclick="askTutor()">Ask Tutor</button>

<div id="aiResponse"></div>

</div>

<textarea id="code"></textarea>

<iframe id="preview"></iframe>

</div>
</div>

<script>

const canvas = document.getElementById("map")
const ctx = canvas.getContext("2d")

const HF_TOKEN = "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"

let xp = 0
let unlocked = 1
let currentLesson = 1

const islands = [
{x:0.2,y:0.7,id:1},
{x:0.4,y:0.4,id:2},
{x:0.6,y:0.7,id:3},
{x:0.75,y:0.35,id:4},
{x:0.9,y:0.65,id:5}
]

const lessons = {

1:{
title:"HTML Basics",
text:"HTML builds the structure of a webpage.",
goal:"Add another paragraph.",
hint:"Use <p> tags.",
starter:`<h1>Hello</h1>
<p>My first website</p>`
},

2:{
title:"CSS Styling",
text:"CSS changes how pages look.",
goal:"Change the background color.",
hint:"Use style='background:red'",
starter:`<body style="background:white">
<h1>Hello</h1>
</body>`
},

3:{
title:"JavaScript",
text:"JavaScript makes pages interactive.",
goal:"Show an alert when clicking a button.",
hint:"onclick='alert("Hi")'",
starter:`<button onclick="alert('Hi')">Click</button>`
},

4:{
title:"Functions",
text:"Functions reuse code.",
goal:"Create a function and run it.",
hint:"function hello(){}",
starter:`<button onclick="hello()">Click</button>

<script>
function hello(){
alert("Hello")
}
<\/script>`
},

5:{
title:"Random Numbers",
text:"Games use random numbers.",
goal:"Show a random number.",
hint:"Math.random()",
starter:`<button onclick="roll()">Roll</button>

<script>
function roll(){
alert(Math.floor(Math.random()*10))
}
<\/script>`
}

}

function resizeCanvas(){
canvas.width = window.innerWidth * 0.9
canvas.height = 400
drawMap()
}

function drawMap(){

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="#22c55e"
ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2)

ctx.strokeStyle="#d4a373"
ctx.lineWidth=6

for(let i=0;i<islands.length-1;i++){
let a=islands[i]
let b=islands[i+1]

ctx.beginPath()
ctx.moveTo(a.x*canvas.width,a.y*canvas.height)
ctx.lineTo(b.x*canvas.width,b.y*canvas.height)
ctx.stroke()
}

islands.forEach(i=>{

let x=i.x*canvas.width
let y=i.y*canvas.height

ctx.fillStyle = i.id<=unlocked ? "#facc15" : "#555"

ctx.beginPath()
ctx.arc(x,y,25,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="black"
ctx.fillText(i.id,x-3,y+4)

})

}

canvas.addEventListener("click",function(e){

const rect = canvas.getBoundingClientRect()
const mx = e.clientX - rect.left
const my = e.clientY - rect.top

islands.forEach(i=>{

let x=i.x*canvas.width
let y=i.y*canvas.height

if(Math.hypot(mx-x,my-y)<25){

if(i.id>unlocked){
alert("Finish earlier lessons first")
return
}

loadLesson(i.id)
openEditor()

}

})

})

function loadLesson(id){

currentLesson=id
const l=lessons[id]

lessonTitle.innerText=l.title
lessonText.innerText=l.text
lessonGoal.innerText=l.goal
lessonHint.innerText=l.hint

code.value=l.starter

}

function openEditor(){
editor.style.display="block"
canvas.style.display="none"
}

function closeEditor(){
editor.style.display="none"
canvas.style.display="block"
drawMap()
}

function runCode(){
preview.srcdoc = code.value
}

function completeLesson(){

xp+=50

if(currentLesson===unlocked){
unlocked++
}

document.getElementById("xp").innerText="⭐ XP: "+xp

alert("Lesson complete!")
drawMap()

}

async function askTutor(){

const question = document.getElementById("aiQuestion").value
const lesson = lessons[currentLesson]

const prompt = `
You are a friendly coding tutor helping beginners.

Lesson: ${lesson.title}

Lesson explanation:
${lesson.text}

Student code:
${code.value}

Student question:
${question}

Explain clearly and give hints but do not give the full solution.
`

document.getElementById("aiResponse").innerText="Thinking..."

const response = await fetch(
"https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2",
{
method:"POST",
headers:{
"Authorization":`Bearer ${HF_TOKEN}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
inputs:prompt
})
})

const data = await response.json()

document.getElementById("aiResponse").innerText =
data[0]?.generated_text || "No response"

}

window.onload = resizeCanvas
window.onresize = resizeCanvas

</script>

</body>
</html>

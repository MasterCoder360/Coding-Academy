<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coding Academy Map</title>
<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

header{
padding:15px;
background:linear-gradient(90deg,#6366f1,#a855f7);
}

canvas{
display:block;
margin:auto;
background:#6ee7b7;
border-radius:15px;
}

#editor{
display:none;
height:500px;
margin-top:10px;
}

#code{
width:50%;
height:100%;
float:left;
background:#111827;
color:#22c55e;
font-family:monospace;
padding:10px;
border:none;
}

#preview{
width:50%;
height:100%;
float:left;
background:white;
}

button{
padding:10px 20px;
margin:10px;
border:none;
border-radius:8px;
background:#6366f1;
color:white;
cursor:pointer;
font-weight:bold;
}

</style>
</head>
<body>

<header>
<h1>🚀 Coding Academy Map</h1>
<p>Click a pillar to learn and practice coding</p>
</header>

<canvas id="map" width="900" height="500"></canvas>

<div id="editor">

<button onclick="runCode()">Run Code ▶</button>
<button onclick="closeEditor()">Back to Map</button>

<div>
<textarea id="code">

<!DOCTYPE html>
<html>
<body>

<h1>Hello Student!</h1>
<p>Try editing this code.</p>

</body>
</html>

</textarea>

<iframe id="preview"></iframe>
</div>

</div>

<script>

const canvas = document.getElementById("map")
const ctx = canvas.getContext("2d")

const pillars = [
{x:150,y:350,id:1,title:"HTML Basics",desc:"Learn how websites are structured."},
{x:300,y:250,id:2,title:"CSS Styling",desc:"Learn how to style websites."},
{x:450,y:350,id:3,title:"JavaScript",desc:"Make websites interactive."},
{x:600,y:220,id:4,title:"Functions",desc:"Learn reusable code blocks."},
{x:750,y:330,id:5,title:"Game Logic",desc:"Use code to build games."}
]

function drawMap(){

// sky
ctx.fillStyle="#87ceeb"
ctx.fillRect(0,0,900,250)

// ground
ctx.fillStyle="#22c55e"
ctx.fillRect(0,250,900,250)

// path
ctx.fillStyle="#d4a373"
ctx.fillRect(0,320,900,40)

// pillars
pillars.forEach(p=>{

ctx.fillStyle="#a855f7"
ctx.fillRect(p.x,p.y,40,80)

ctx.fillStyle="white"
ctx.font="20px Arial"
ctx.fillText(p.id,p.x+15,p.y+45)

})

}

drawMap()

canvas.addEventListener("click",function(e){

const rect = canvas.getBoundingClientRect()
const mx = e.clientX - rect.left
const my = e.clientY - rect.top

pillars.forEach(p=>{

if(mx>p.x && mx<p.x+40 && my>p.y && my<p.y+80){

alert("Pillar "+p.id+": "+p.title+"\n\n"+p.desc)

openEditor()

}

})

})

function openEditor(){

document.getElementById("editor").style.display="block"
canvas.style.display="none"

}

function closeEditor(){

document.getElementById("editor").style.display="none"
canvas.style.display="block"

}

function runCode(){

const code = document.getElementById("code").value
const frame = document.getElementById("preview")

frame.srcdoc = code

}

</script>

</body>
</html>

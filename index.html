<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Coding Academy 2D Adventure - Colored Robots & Portals</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial;overflow:hidden;}
header{text-align:center;padding:15px;background:linear-gradient(90deg,#6366f1,#a855f7);}
#stats{margin-top:5px;font-weight:bold;}
#dialogue{color:#fbbf24;font-weight:bold;margin-top:5px;}
canvas{display:block;margin:0 auto;background:#87ceeb;border-radius:15px;}
.panel{background:#1e293b;margin:20px;padding:20px;border-radius:15px;}
button{padding:10px 20px;border:none;border-radius:10px;background:#6366f1;color:white;cursor:pointer;font-weight:bold;}
button:hover{background:#4f46e5;}
</style>
</head>
<body>

<header>
<h1>🚀 Coding Academy 2D Adventure</h1>
<div id="stats">XP: <span id="xp">0</span> | Coins: <span id="coins">0</span> | ❤️ Health: <span id="health">100</span></div>
<div id="dialogue">Find the robots, collect coins, and avoid enemies!</div>
</header>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<div class="panel">
<p>Use <b>W, A, S, D</b> to move. SPACE to attack enemies.</p>
<button onclick="completeMission()">Complete Current Mission</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let student = JSON.parse(localStorage.getItem('academy2D')) || {xp:0, coins:0, health:100, unlocked:1};
let keys = {};
let player = {x:400,y:400,w:20,h:30,speed:3};
let coins=[], robots=[], enemies=[], mountains=[], portals=[];
let portalGlow=0;

// Initialize objects
function initGame(){
    // Mountains
    for(let i=0;i<8;i++){
        mountains.push({x:Math.random()*760+20, y:Math.random()*250+150, w:40, h:60});
    }
    // Coins
    for(let i=0;i<10;i++){
        coins.push({x:Math.random()*760+20, y:Math.random()*460+20, r:8});
    }
    // Robots (purple)
    robots = [
        {x:100, y:350, w:20, h:30, msg:"Code runs step by step!", read:false},
        {x:400, y:200, w:20, h:30, msg:"Loops repeat actions!", read:false},
        {x:700, y:300, w:20, h:30, msg:"IF statements make decisions!", read:false}
    ];
    // Enemies
    for(let i=0;i<5;i++){
        enemies.push({x:Math.random()*760+20,y:Math.random()*460+20,w:20,h:20,hp:40,blink:true});
    }
    // Portals (pink)
    for(let i=1;i<=3;i++){
        portals.push({x:i*200-100,y:50,w:30,h:10,level:i,active:false});
    }
    updateUI();
    requestAnimationFrame(gameLoop);
}

// Save & UI
function saveGame(){ localStorage.setItem('academy2D',JSON.stringify(student)); updateUI(); }
function updateUI(){
    document.getElementById('xp').innerText = student.xp;
    document.getElementById('coins').innerText = student.coins;
    document.getElementById('health').innerText = Math.max(0,Math.floor(student.health));
}

// Keyboard
document.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

// Complete mission
function completeMission(){
    student.xp +=50;
    student.coins +=25;
    if(student.unlocked<3) student.unlocked++;
    alert("Mission Complete! Next Level Unlocked!");
    saveGame();
}

// Collision helpers
function circleCollide(px,py,r,cx,cy,cr){let dx=px-cx,dy=py-cy;return Math.sqrt(dx*dx+dy*dy)<r+cr;}

// Game loop
function gameLoop(){
    // Move player
    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;
    player.x=Math.max(0,Math.min(780,player.x));
    player.y=Math.max(0,Math.min(470,player.y));

    // Collect coins
    for(let i=coins.length-1;i>=0;i--){
        let c=coins[i];
        if(circleCollide(player.x+player.w/2,player.y+player.h/2,c.r,c.x,c.y,c.r)){
            coins.splice(i,1);
            student.coins+=10;
            student.xp+=5;
            saveGame();
        }
    }

    // Interact robots
    robots.forEach(r=>{
        let dx=player.x+player.w/2-(r.x+r.w/2);
        let dy=player.y+player.h/2-(r.y+r.h/2);
        if(Math.sqrt(dx*dx+dy*dy)<30){
            document.getElementById('dialogue').innerText = r.msg;
            if(!r.read){student.xp+=20;r.read=true; saveGame();}
        }
    });

    // Enemy AI
    enemies.forEach(e=>{
        e.blink = !e.blink;
        let dx = player.x - e.x;
        let dy = player.y - e.y;
        let dist = Math.sqrt(dx*dx+dy*dy);
        if(dist>0){ e.x+=dx/dist*0.5; e.y+=dy/dist*0.5; }
        if(dist<20){ student.health-=0.2; updateUI(); }
    });

    // Portal glow
    portalGlow += 0.05;

    // Draw background
    ctx.fillStyle="#87ceeb"; ctx.fillRect(0,0,canvas.width,canvas.height/2); // sky
    ctx.fillStyle="#22c55e"; ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2); // ground

    // Draw mountains
    ctx.fillStyle="#475569";
    mountains.forEach(m=>{
        ctx.beginPath();
        ctx.moveTo(m.x,m.y);
        ctx.lineTo(m.x+m.w/2,m.y-m.h);
        ctx.lineTo(m.x+m.w,m.y);
        ctx.closePath();
        ctx.fill();
    });

    // Draw portals (pink, glowing)
    portals.forEach(p=>{
        let glow = 0.5 + 0.5*Math.sin(portalGlow);
        ctx.fillStyle=`rgba(236,72,153,${glow})`; // pink
        ctx.fillRect(p.x,p.y,p.w,p.h);
    });

    // Draw coins
    ctx.fillStyle="#ffd700";
    coins.forEach(c=>{
        ctx.beginPath();
        ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
        ctx.fill();
    });

    // Draw robots (purple)
    ctx.fillStyle="#a855f7";
    robots.forEach(r=>ctx.fillRect(r.x,r.y,r.w,r.h));

    // Draw enemies
    ctx.fillStyle="#ff0000";
    enemies.forEach(e=>{ if(e.blink) ctx.fillRect(e.x,e.y,e.w,e.h); });

    // Draw player
    ctx.fillStyle="#6366f1";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    requestAnimationFrame(gameLoop);
}

// Start game
initGame();
</script>
</body>
</html>
